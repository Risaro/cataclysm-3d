name: Feature request
description: Suggest an improvement for the 3D view
labels: ["enhancement"]

body:
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: What should the 3D view do, and why would it make the game better?
    validations:
      required: true

  - type: textarea
    id: reference
    attributes:
      label: References
      description: Screenshots, mockups or games that do something similar.
