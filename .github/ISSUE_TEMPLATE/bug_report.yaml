name: 3D view bug
description: Something looks wrong, crashes or misbehaves in the 3D view
labels: ["bug"]

body:
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: A clear description of the bug.
      placeholder: Doors on building corners face the wrong way.
    validations:
      required: true

  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: Drag a screenshot here. For visual bugs this is the most useful part.
    validations:
      required: true

  - type: dropdown
    id: style
    attributes:
      label: 3D view style
      options:
        - Voxels
        - Tileset sprites
    validations:
      required: true

  - type: input
    id: tileset
    attributes:
      label: Voxel tileset and 2D tileset
      placeholder: Built-in procedural models, UltimateCataclysm

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Walk to a gas station
        2. Rotate the camera with Alt+Left
        3. See the pump floating above the ground

  - type: input
    id: system
    attributes:
      label: System
      description: Operating system, graphics card and the release or commit you run.
      placeholder: Windows 11, GTX 1060, cataclysm-3d-2026-10-21-0215
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Debug log
      description: Lines mentioning "voxel" from config/debug.log, if any.
      render: text
