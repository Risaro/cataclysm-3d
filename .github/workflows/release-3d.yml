name: "Cataclysm 3D Release"
concurrency: release-3d
on:
  workflow_dispatch:

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions: write-all
    outputs:
      timestamp: ${{ steps.get-timestamp.outputs.time }}
    steps:
      - name: Get build timestamp
        id: get-timestamp
        run: |
          echo "time=$(/bin/date -u "+%Y-%m-%d-%H%M")" >> $GITHUB_OUTPUT
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Create release
        env:
          TIME: ${{ steps.get-timestamp.outputs.time }}
        run: |
          cat > notes.md <<'EOL'
          Cataclysm 3D: Cataclysm: Dark Days Ahead with a 3D voxel renderer.

          Downloads:
          - **Windows**: `cataclysm-3d-windows-with-graphics-and-sounds-x64-*.zip`, unpack and run `cataclysm-tiles.exe`.
          - **Linux**: `cataclysm-3d-linux-with-graphics-and-sounds-x64-*.tar.gz`, unpack and run `./cataclysm-launcher`.
          - **macOS**: `cataclysm-3d-osx-with-graphics-universal-*.dmg`, open it and drag Cataclysm to Applications.

          The 3D view is on by default. Hold the middle mouse button and drag to rotate the camera, use the zoom keys to move closer. Options are in Settings, Graphics, Tileset options. Tilesets, sounds and translations are included.
          EOL
          gh release create "cataclysm-3d-${TIME}" --notes-file notes.md --prerelease --title "Cataclysm 3D ${TIME}" --target "$(git log -1 --format='%H')"

  compose-tilesets:
    uses: ./.github/workflows/compose-tilesets.yml

  build-translations:
    name: Fetch translations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Install gettext
        run: sudo apt-get update && sudo apt-get install -y gettext
      - name: Download upstream translations
        run: |
          tag=$(gh release list -R CleverRaven/Cataclysm-DDA -L 1 --json tagName -q '.[0].tagName')
          gh release download "$tag" -R CleverRaven/Cataclysm-DDA -p "cdda-translations-*.tar.gz" -D upstream
          tar -xzf upstream/cdda-translations-*.tar.gz
      - name: Merge Cataclysm 3D translations
        run: |
          for po in lang/voxel/*.po; do
            lang=$(basename "$po" .po)
            if [ -f "lang/po/$lang.po" ]; then
              msgcat --use-first "$po" "lang/po/$lang.po" -o "lang/po/$lang.po.new"
              mv "lang/po/$lang.po.new" "lang/po/$lang.po"
            fi
          done
      - name: Store translation artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: "translations"
          path: |
            lang/po
            src/lang_stats.inc
            data/credits
            data/motd

  compile-shaders:
    name: Compile shaders
    runs-on: ubuntu-24.04
    steps:
    - name: checkout repository
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        persist-credentials: false

    - name: build SDL3 shader artifacts
      uses: ./.github/actions/build-sdl3-shaders

  builds:
    needs:
      - release
      - compose-tilesets
      - build-translations
      - compile-shaders
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows Tiles Sounds x64 MSVC
            artifact: windows-with-graphics-and-sounds-x64
            arch: x64
            os: windows-2022
            ext: zip
            content: application/zip
            tiles: 1
            sound: 1
          - name: macOS Tiles Universal Binary (x64 and arm64)
            os: macos-15
            tiles: 1
            sound: 1
            artifact: osx-with-graphics-universal
            ext: dmg
            content: application/x-apple-diskimage
          - name: Linux Tiles Sounds x64
            os: ubuntu-24.04
            android: none
            libbacktrace: 1
            tiles: 1
            sound: 1
            artifact: linux-with-graphics-and-sounds-x64
            ext: tar.gz
            content: application/gzip
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions: write-all
    env:
        ZSTD_CLEVEL: 17
    steps:
      - name: Maximize build space (mac)
        if: ${{ runner.os == 'macos' && matrix.android == '' }}
        run: |
          sudo rm -rf $ANDROID_HOME
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-tags: true
          persist-credentials: false
      - name: Get soundpack
        if: matrix.sound == 1
        run: |
          git clone --depth=1 --shallow-submodules --recurse-submodules https://github.com/Fris0uman/CDDA-Soundpacks '${{ github.workspace }}/CDDA-Soundpacks'
          mv '${{ github.workspace }}/CDDA-Soundpacks/sound/CC-Sounds' '${{ github.workspace }}/data/sound'
      - name: Fetch tileset artifact into build
        if: matrix.tiles == 1
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: tileset-*
          path: gfx
          merge-multiple: true
      - name: Fetch translations artifact into build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: translations
      - name: Fetch shader artifacts into build
        if: matrix.tiles == 1
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cdda-shaders
          path: data/shaders
      - name: Mark shader artifacts fresh
        if: matrix.tiles == 1
        shell: bash
        run: |
          # Bump artifact mtimes so the Make/CMake shader rule sees them as
          # up-to-date and skips invoking build_shaders.py.
          touch data/shaders/build-*.stamp data/shaders/*.spv data/shaders/*.dxil data/shaders/*.msl
      - name: Install dependencies (windows msvc) (1/4)
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2
      - name: Install dependencies (windows msvc) (2/4)
        if: runner.os == 'Windows'
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        id: runvcpkg
        with:
          vcpkgDirectory: '${{ runner.workspace }}/b/vcpkg'
          vcpkgGitCommitId: 'f6672d8e480ccdecddfad3fd1b838ba369ffe6cd'
      - name: Install dependencies (windows msvc) (3/4)
        if: runner.os == 'Windows'
        run: |
          vcpkg integrate install --vcpkg-root '${{ runner.workspace }}\b\vcpkg'
      - name: Install dependencies (windows msvc) (4/4)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@4f806de0a5a7294ffabaff804b38a9b435a73bda # v2
        with:
          msystem: mingw64
          install: >-
            gettext
            make
      - name: Cache vcpkg packages (Windows)
        if: runner.os == 'Windows' && matrix.tiles == 1
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: msvc-full-features/vcpkg_installed
          key: vcpkg-installed-sdl3-${{ hashFiles('msvc-full-features/vcpkg.json', '.github/vcpkg_triplets/x64-windows-static.cmake') }}-f6672d8e480ccdecddfad3fd1b838ba369ffe6cd
      - name: Install dependencies (Linux, curses)
        if: runner.os == 'Linux' && matrix.android == 'none' && !matrix.wasm && matrix.tiles != 1
        run: |
          sudo apt-get update
          sudo apt-get install -y libncursesw5-dev ccache gettext parallel
      - name: Install dependencies (Linux, tiles)
        if: runner.os == 'Linux' && matrix.android == 'none' && !matrix.wasm && matrix.tiles == 1
        run: |
          sudo apt-get update
          wget -O /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 18
          sudo apt-get install -y libncursesw5-dev ccache gettext parallel patchelf
      - name: Setup SDL3 stack (Linux)
        if: runner.os == 'Linux' && matrix.android == 'none' && !matrix.wasm && matrix.tiles == 1
        uses: ./.github/actions/setup-sdl3-stack
        with:
          cache-key: sdl3-stack-strict-sdl-3.4.10-image-3.4.4-ttf-3.2.2-mixer-3.2.4-ubuntu-24.04-v2
          prefix: ${{ runner.workspace }}/sdl3_prefix
          stage-licenses: "true"
      - name: Install build dependencies (mac)
        if: runner.os == 'macOS'
        run: |
          HOMEBREW_NO_AUTO_UPDATE=yes HOMEBREW_NO_INSTALL_CLEANUP=yes brew install gettext ccache parallel dylibbundler
          pip3 install --break-system-packages dmgbuild biplist
      - name: install macports (mac)
        if: runner.os == 'macOS' && matrix.tiles == 1
        uses: melusina-org/setup-macports@c7eb59386def259a274627092566a7f7b8d219b1 # v1
      - name: install macports packages (mac)
        if: runner.os == 'macOS' && matrix.tiles == 1
        run: |
          # SDL_mixer VENDORED=OFF pulls every mixer codec from a system lib.
          # The macOS artifact is universal, so each (plus libiconv, a
          # transitive dep of flac/wavpack) must be +universal.
          sudo port install freetype +universal pkgconfig +universal \
              libiconv +universal libogg +universal flac +universal \
              libvorbis +universal wavpack +universal mpg123 +universal
      - name: Cache SDL3 stack source build (mac)
        if: runner.os == 'macOS' && matrix.tiles == 1
        id: cache-sdl3-release-macos
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.workspace }}/sdl3_prefix
          key: sdl3-stack-universal-sdl-3.4.10-image-3.4.4-ttf-3.2.2-mixer-3.2.4-${{ runner.os }}-v5
      - name: Build SDL3 stack from source (mac, universal)
        if: runner.os == 'macOS' && matrix.tiles == 1 && steps.cache-sdl3-release-macos.outputs.cache-hit != 'true'
        run: |
          PREFIX=${{ runner.workspace }}/sdl3_prefix
          export PKG_CONFIG_PATH=$PREFIX/lib/pkgconfig:/opt/local/lib/pkgconfig
          # wavpack's Findwavpack.cmake uses plain find_library (no pkg-config),
          # so /opt/local must be on CMAKE_PREFIX_PATH.
          export CMAKE_PREFIX_PATH=$PREFIX:/opt/local
          ARCH_ARG='-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64'
          git clone --depth 1 --branch release-3.4.10 https://github.com/libsdl-org/SDL.git sdl3_src
          cmake -S sdl3_src -B sdl3_build "$ARCH_ARG" \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=$PREFIX \
              -DBUILD_SHARED_LIBS=ON
          cmake --build sdl3_build -j$(sysctl -n hw.ncpu)
          cmake --install sdl3_build
          git clone --depth 1 --branch release-3.4.4 --recurse-submodules --shallow-submodules https://github.com/libsdl-org/SDL_image.git sdl3_image_src
          cmake -S sdl3_image_src -B sdl3_image_build "$ARCH_ARG" \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=$PREFIX \
              -DSDLIMAGE_VENDORED=ON \
              -DSDLIMAGE_DEPS_SHARED=OFF \
              -DSDLIMAGE_STRICT=ON \
              -DSDLIMAGE_BACKEND_IMAGEIO=OFF \
              -DSDLIMAGE_PNG=ON -DSDLIMAGE_PNG_LIBPNG=ON \
              -DSDLIMAGE_JPG=ON \
              -DSDLIMAGE_AVIF=OFF -DSDLIMAGE_JXL=OFF \
              -DSDLIMAGE_TIF=OFF -DSDLIMAGE_WEBP=OFF \
              -DPNG_ARM_NEON=off \
              -DBUILD_SHARED_LIBS=ON
          cmake --build sdl3_image_build -j$(sysctl -n hw.ncpu)
          cmake --install sdl3_image_build
          git clone --depth 1 --branch release-3.2.2 --recurse-submodules --shallow-submodules https://github.com/libsdl-org/SDL_ttf.git sdl3_ttf_src
          cmake -S sdl3_ttf_src -B sdl3_ttf_build "$ARCH_ARG" \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=$PREFIX \
              -DSDLTTF_VENDORED=ON \
              -DSDLTTF_STRICT=ON \
              -DSDLTTF_PLUTOSVG=OFF \
              -DBUILD_SHARED_LIBS=ON
          cmake --build sdl3_ttf_build -j$(sysctl -n hw.ncpu)
          cmake --install sdl3_ttf_build
          git clone --depth 1 --branch release-3.2.4 --recurse-submodules --shallow-submodules https://github.com/libsdl-org/SDL_mixer.git sdl3_mixer_src
          # VENDORED=OFF links the MacPorts codecs (LC_LOAD_DYLIB), not static-
          # embed; mpg123 (LGPL) ships as a separate dylib. DEPS_SHARED=OFF keeps
          # real link edges, not dlopen-by-name (no LC_LOAD_DYLIB, breaks bundler).
          cmake -S sdl3_mixer_src -B sdl3_mixer_build "$ARCH_ARG" \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=$PREFIX \
              -DSDLMIXER_VENDORED=OFF \
              -DSDLMIXER_DEPS_SHARED=OFF \
              -DSDLMIXER_STRICT=ON \
              -DSDLMIXER_FLAC=ON -DSDLMIXER_FLAC_LIBFLAC=ON -DSDLMIXER_FLAC_DRFLAC=OFF \
              -DSDLMIXER_MP3=ON -DSDLMIXER_MP3_MPG123=ON -DSDLMIXER_MP3_MPG123_SHARED=OFF -DSDLMIXER_MP3_DRMP3=OFF \
              -DSDLMIXER_VORBIS_VORBISFILE=ON -DSDLMIXER_VORBIS_STB=OFF -DSDLMIXER_VORBIS_TREMOR=OFF \
              -DSDLMIXER_WAVPACK=ON \
              -DSDLMIXER_OPUS=OFF -DSDLMIXER_MOD=OFF -DSDLMIXER_MIDI=OFF -DSDLMIXER_GME=OFF \
              -DBUILD_SHARED_LIBS=ON
          cmake --build sdl3_mixer_build -j$(sysctl -n hw.ncpu)
          cmake --install sdl3_mixer_build
          # Confirm a real link edge, not dlopen-by-name: otherwise
          # dylibbundler ships no mpg123 dylib and LGPL swappability is lost.
          if ! otool -L "$PREFIX"/lib/libSDL3_mixer*.dylib | grep -q mpg123; then
              echo "ERROR: SDL3_mixer.dylib has no mpg123 LC_LOAD_DYLIB edge" >&2
              exit 1
          fi
          mkdir -p $PREFIX/share
          cp sdl3_src/LICENSE.txt $PREFIX/share/LICENSE-SDL.txt
          cp sdl3_image_src/LICENSE.txt $PREFIX/share/LICENSE-SDL3_image.txt
          cp sdl3_ttf_src/LICENSE.txt $PREFIX/share/LICENSE-SDL3_ttf.txt
          cp sdl3_mixer_src/LICENSE.txt $PREFIX/share/LICENSE-SDL3_mixer.txt
          # SDL_image/SDL_ttf use VENDORED=ON (codecs static in the companion
          # dylib), so harvest each codec's LICENSE/COPYING from external/.
          for dep in \
              sdl3_image_src/external/libpng \
              sdl3_image_src/external/jpeg \
              sdl3_ttf_src/external/freetype \
              sdl3_ttf_src/external/harfbuzz; do
              if [ -d "$dep" ]; then
                  name=$(basename "$dep")
                  for cand in "$dep"/LICENSE "$dep"/LICENSE.txt "$dep"/LICENSE.md \
                              "$dep"/COPYING "$dep"/COPYING.txt "$dep"/COPYING.LIB \
                              "$dep"/copyright; do
                      if [ -f "$cand" ]; then
                          cp "$cand" "$PREFIX/share/LICENSE-vendored-$name.txt"
                          break
                      fi
                  done
              fi
          done
          # SDL_mixer VENDORED=OFF ships flac/ogg/vorbis/mpg123/wavpack as
          # separate MacPorts dylibs (no license installed); glob COPYING*/
          # LICENSE* from each SDL_mixer submodule (FLAC uses COPYING.Xiph), fail if empty.
          for dep in flac ogg vorbis mpg123 wavpack; do
              src="sdl3_mixer_src/external/$dep"
              out="$PREFIX/share/LICENSE-vendored-$dep.txt"
              : > "$out"
              for lic in "$src"/COPYING* "$src"/COPYRIGHT* "$src"/LICENSE* "$src"/License* "$src"/license*; do
                  if [ -f "$lic" ]; then
                      echo "=== $(basename "$lic") ===" >> "$out"
                      cat "$lic" >> "$out"
                      echo >> "$out"
                  fi
              done
              if [ ! -s "$out" ]; then
                  echo "ERROR: no license for bundled codec $dep in SDL_mixer source" >&2
                  exit 1
              fi
          done
      - name: Stage SDL3 license files (mac)
        if: runner.os == 'macOS' && matrix.tiles == 1
        run: |
          cp ${{ runner.workspace }}/sdl3_prefix/share/LICENSE-SDL.txt ${{ github.workspace }}/LICENSE-SDL.txt
          cp ${{ runner.workspace }}/sdl3_prefix/share/LICENSE-SDL3_image.txt ${{ github.workspace }}/LICENSE-SDL3_image.txt
          cp ${{ runner.workspace }}/sdl3_prefix/share/LICENSE-SDL3_ttf.txt ${{ github.workspace }}/LICENSE-SDL3_ttf.txt
          cp ${{ runner.workspace }}/sdl3_prefix/share/LICENSE-SDL3_mixer.txt ${{ github.workspace }}/LICENSE-SDL3_mixer.txt
          for f in ${{ runner.workspace }}/sdl3_prefix/share/LICENSE-vendored-*.txt; do
              if [ -f "$f" ]; then
                  cp "$f" "${{ github.workspace }}/$(basename "$f")"
              fi
          done
          # libiconv (LGPL) is bundled transitively via flac/wavpack but has no
          # license on the MacPorts install or in any source tree, so ship the
          # vendored copy committed in the repo.
          cp ${{ github.workspace }}/build-data/osx/LICENSE-libiconv.txt ${{ github.workspace }}/LICENSE-vendored-libiconv.txt
          # Every bundled codec plus libiconv must carry a non-empty license,
          # independent of cache state (a stale prefix could skip the harvest).
          for required in libiconv flac ogg vorbis mpg123 wavpack; do
              if [ ! -s "${{ github.workspace }}/LICENSE-vendored-$required.txt" ]; then
                  echo "ERROR: LICENSE-vendored-$required.txt missing or empty" >&2
                  exit 1
              fi
          done
      - name: Create VERSION.TXT
        shell: bash
        run: |
          cat >VERSION.txt <<EOL
          build type: ${{ matrix.artifact }}
          build number: ${NEEDS_RELEASE_OUTPUTS_TIMESTAMP}
          commit sha: ${{ github.sha }}
          commit url: https://github.com/${{ github.repository }}/commit/${{ github.sha }}
          EOL
        env:
          NEEDS_RELEASE_OUTPUTS_TIMESTAMP: ${{ needs.release.outputs.timestamp }}
      - name: Compile translations (windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          lang/compile_mo.sh all
      - name: Build libbacktrace
        if: matrix.libbacktrace == 1
        run: |
          git clone https://github.com/ianlancetaylor/libbacktrace.git
          cd libbacktrace
          git checkout 14818b7783eeb9a56c3f0fca78cefd3143f8c5f6
          ./configure
          make -j$((`nproc`+0))
          cp LICENSE ${{ github.workspace }}/LICENSE-libbacktrace.txt
          sudo make install
      - name: Build CDDA (linux)
        if: runner.os == 'Linux' && matrix.android == 'none' && !matrix.wasm
        run: |
          if [ "${{ matrix.tiles }}" = "1" ]; then
            export PKG_CONFIG_PATH="$RUNNER_WORKSPACE/sdl3_prefix/lib/pkgconfig:$RUNNER_WORKSPACE/sdl3_prefix/lib/x86_64-linux-gnu/pkgconfig"
            export LD_LIBRARY_PATH="$RUNNER_WORKSPACE/sdl3_prefix/lib:$RUNNER_WORKSPACE/sdl3_prefix/lib/x86_64-linux-gnu"
          fi
          make COMPILER=clang++-18 -j$((`nproc`+0)) TILES=${{ matrix.tiles }} SOUND=${{ matrix.sound }} RELEASE=1 LOCALIZE=1 LANGUAGES=all BACKTRACE=1 LIBBACKTRACE=${{ matrix.libbacktrace }} WARN_STALE_DATA=1 PCH=0 bindist
          mv cataclysmdda-0.J.tar.gz cataclysm-3d-${{ matrix.artifact }}-${{ needs.release.outputs.timestamp }}.tar.gz
      - name: Build CDDA (windows msvc)
        if: runner.os == 'Windows' && matrix.tiles == 1
        env:
          BACKTRACE: 1
          CDDA_RELEASE_BUILD: 1
          VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}\.github\vcpkg_triplets
        run: |
          msbuild -m -p:Configuration=Release -p:Platform=${{ matrix.arch }} "-target:Cataclysm-vcpkg-static;JsonFormatter-vcpkg-static;zzip" msvc-full-features\Cataclysm-vcpkg-static.sln
          .\build-scripts\windist.ps1
          mv cataclysmdda-0.J.zip cataclysm-3d-${{ matrix.artifact }}-${{ needs.release.outputs.timestamp }}.zip
      - name: Build CDDA (osx, tiles)
        if: runner.os == 'macOS' && matrix.tiles == 1
        env:
          PKG_CONFIG_PATH: ${{ runner.workspace }}/sdl3_prefix/lib/pkgconfig:/opt/local/lib/pkgconfig
          # The MacPorts codecs live in /opt/local/lib; dylibbundler needs it
          # so the mpg123 (and friends) dylibs get pulled into the bundle.
          DYLIBBUNDLER_SEARCH_PATHS: ${{ runner.workspace }}/sdl3_prefix/lib /opt/local/lib
        run: |
          make -j3 TILES=${{ matrix.tiles }} SOUND=${{ matrix.sound }} RELEASE=1 LOCALIZE=1 LANGUAGES=all BACKTRACE=0 PCH=0 USE_HOME_DIR=1 UNIVERSAL_BINARY=1 WARN_STALE_DATA=1 dmgdist
          # LGPL gate: mpg123 must ship as a standalone dylib in the bundle so
          # it stays user-replaceable. Empty match means dylibbundler did not
          # bundle it and the build must fail rather than ship a violation.
          if ! ls Cataclysm.app/Contents/Resources/libmpg123*.dylib >/dev/null 2>&1; then
              echo "ERROR: libmpg123 dylib missing from app bundle Resources" >&2
              exit 1
          fi
          mv Cataclysm.dmg cataclysm-3d-${{ matrix.artifact }}-${{ needs.release.outputs.timestamp }}.dmg
      - name: Upload release asset
        shell: bash
        env:
          TIME: ${{ needs.release.outputs.timestamp }}
        run: |
          gh release upload "cataclysm-3d-${TIME}" "cataclysm-3d-${{ matrix.artifact }}-${TIME}.${{ matrix.ext }}"
